<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอปดูสภาพอากาศ</title>
<style>
:root{--bg:#eaf2fb;--card:#ffffffd9;--tx:#13202f;--mu:#5b6b7f;--bd:#d5e0ee;--ac:#1f6feb;--ac2:#fff;--bad:#c93c37;--hero:linear-gradient(160deg,#4aa3ff,#1f6feb)}
@media(prefers-color-scheme:dark){:root{--bg:#0d141d;--card:#17212cd9;--tx:#e8eef6;--mu:#9aa8ba;--bd:#2a3645;--ac:#58a6ff;--ac2:#0b1320;--bad:#ff7b72;--hero:linear-gradient(160deg,#1b4a86,#12294d);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Sarabun','Noto Sans Thai',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;position:relative}
input{flex:1;padding:11px 12px;border:1px solid var(--bd);border-radius:11px;background:var(--card);color:var(--tx);font:inherit;min-width:0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 13px;border-radius:11px}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
#sug{position:absolute;top:48px;left:0;right:100px;background:var(--bg);border:1px solid var(--bd);border-radius:11px;z-index:5;overflow:hidden;box-shadow:0 8px 24px #0003}
#sug button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{padding:5px 11px;border-radius:99px;font-size:.88rem}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:20px;margin:6px 0 12px}
.hero .loc{font-size:1.15rem;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .big{display:flex;align-items:center;gap:10px;margin:6px 0}
.hero .t{font-size:4rem;font-weight:700;line-height:1}
.hero .ic{font-size:3.6rem}
.hero small{opacity:.9}
.star{background:#fff3;border-color:#fff4;color:#fff;padding:4px 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(6px)}
.card h2{font-size:1rem;margin:0 0 10px;color:var(--mu);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.m{background:#8881;border-radius:11px;padding:9px 11px}.m span{display:block;font-size:.8rem;color:var(--mu)}.m b{font-size:1.12rem}
.hr{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.h{min-width:64px;text-align:center;font-size:.88rem}.h .i{font-size:1.5rem}.h .r{color:var(--ac);font-size:.78rem;min-height:1.1em}
.d{display:grid;grid-template-columns:70px 34px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:.95rem}
.d:last-child{border:0}
.bar2{height:6px;border-radius:9px;background:#8883;position:relative}.bar2 i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#4aa3ff,#ff9f43)}
#st{text-align:center;color:var(--mu);padding:30px 10px}#st.e{color:var(--bad)}
.foot{font-size:.78rem;color:var(--mu);text-align:center;margin:14px 0}
.u{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.u button{padding:4px 10px;font-size:.85rem}.u .on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
</style>
</head>
<body>
<main>
<div class="bar">
 <input id="q" placeholder="ค้นหาเมือง เช่น เชียงใหม่, ภูเก็ต, Tokyo" autocomplete="off" aria-label="ค้นหาเมือง">
 <button id="gps" title="ตำแหน่งปัจจุบัน" aria-label="ตำแหน่งปัจจุบัน">📍</button>
 <div id="sug" hidden></div>
</div>
<div class="chips" id="favs"></div>
<div class="u"><button id="uc" class="on">°C</button><button id="uf">°F</button></div>
<div id="st">กำลังโหลด…</div>
<div id="app" hidden>
 <div class="hero">
  <div class="loc"><span id="name"></span><button class="star" id="fav" aria-label="บันทึกเมือง">☆</button></div>
  <div class="big"><div class="ic" id="ic"></div><div class="t" id="t"></div></div>
  <div id="desc"></div><small id="hl"></small>
 </div>
 <div class="card"><h2>รายละเอียดตอนนี้</h2><div class="g" id="det"></div></div>
 <div class="card"><h2>รายชั่วโมง (24 ชม. ข้างหน้า)</h2><div class="hr" id="hr"></div></div>
 <div class="card"><h2>พยากรณ์ 7 วัน</h2><div id="dy"></div></div>
 <div class="card"><h2>คุณภาพอากาศ</h2><div class="g" id="aq"></div></div>
 <div class="foot" id="upd"></div>
</div>
<div class="foot">ข้อมูลจาก Open-Meteo.com (CC BY 4.0)</div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var WC={0:['แจ่มใส','☀️','🌙'],1:['แจ่มใสเป็นส่วนใหญ่','🌤️','🌙'],2:['มีเมฆบางส่วน','⛅','☁️'],3:['เมฆมาก','☁️','☁️'],45:['หมอก','🌫️','🌫️'],48:['หมอกน้ำค้างแข็ง','🌫️','🌫️'],51:['ฝนปรอยเบา','🌦️','🌧️'],53:['ฝนปรอย','🌦️','🌧️'],55:['ฝนปรอยหนา','🌧️','🌧️'],56:['ฝนเยือกแข็งเบา','🌧️','🌧️'],57:['ฝนเยือกแข็ง','🌧️','🌧️'],61:['ฝนเล็กน้อย','🌦️','🌧️'],63:['ฝนปานกลาง','🌧️','🌧️'],65:['ฝนหนัก','🌧️','🌧️'],66:['ฝนเยือกแข็ง','🌧️','🌧️'],67:['ฝนเยือกแข็งหนัก','🌧️','🌧️'],71:['หิมะเล็กน้อย','🌨️','🌨️'],73:['หิมะปานกลาง','🌨️','🌨️'],75:['หิมะหนัก','❄️','❄️'],77:['เกล็ดหิมะ','🌨️','🌨️'],80:['ฝนซู่เล็กน้อย','🌦️','🌧️'],81:['ฝนซู่','🌧️','🌧️'],82:['ฝนซู่รุนแรง','⛈️','⛈️'],85:['หิมะโปรย','🌨️','🌨️'],86:['หิมะโปรยหนัก','🌨️','🌨️'],95:['พายุฟ้าคะนอง','⛈️','⛈️'],96:['ฟ้าคะนองมีลูกเห็บ','⛈️','⛈️'],99:['ฟ้าคะนองลูกเห็บรุนแรง','⛈️','⛈️']};
function wc(c,day){var w=WC[c]||['ไม่ทราบ','❔','❔'];return{d:w[0],i:day===0?w[2]:w[1]}}
var KEY='weather-app-v1',S={place:null,favs:[],unit:'C'},cur=null;
function load(){try{var r=JSON.parse(localStorage.getItem(KEY)||'{}');if(r.favs)S.favs=r.favs;if(r.place)S.place=r.place;if(r.unit)S.unit=r.unit}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function T(c){if(c==null)return '–';var v=S.unit==='F'?c*9/5+32:c;return Math.round(v)+'°'}
function msg(t,e){var s=$('st');s.hidden=false;s.className=e?'e':'';s.textContent=t;$('app').hidden=true}
function wdir(d){var n=['เหนือ','ตอ.เหนือ','ตะวันออก','ตอ.ใต้','ใต้','ตต.ใต้','ตะวันตก','ตต.เหนือ'];return n[Math.round(d/45)%8]}
function hhmm(s){return s.slice(11,16)}
function aqi(v){if(v==null)return['–','var(--mu)'];if(v<=50)return['ดี','#2fb36b'];if(v<=100)return['ปานกลาง','#d9a400'];if(v<=150)return['เริ่มมีผลต่อกลุ่มเสี่ยง','#f08a24'];if(v<=200)return['มีผลต่อสุขภาพ','#e5484d'];return['อันตราย','#8e4ec6']}
function uv(v){return v<3?'ต่ำ':v<6?'ปานกลาง':v<8?'สูง':v<11?'สูงมาก':'รุนแรง'}
function key(p){return p.lat.toFixed(2)+','+p.lon.toFixed(2)}
function getJ(u){return fetch(u).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})}
function go(p){
 S.place=p;save();msg('กำลังโหลดสภาพอากาศ…');
 var f='https://api.open-meteo.com/v1/forecast?latitude='+p.lat+'&longitude='+p.lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=7';
 var a='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+p.lat+'&longitude='+p.lon+'&current=us_aqi,pm2_5,pm10&timezone=auto';
 Promise.all([getJ(f),getJ(a).catch(function(){return null})]).then(function(r){cur={w:r[0],a:r[1],p:p};render()}).catch(function(){msg('โหลดข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่',1)})}
function render(){
 var w=cur.w,c=w.current,d=w.daily,h=w.hourly,p=cur.p,x=wc(c.weather_code,c.is_day);
 $('st').hidden=true;$('app').hidden=false;
 $('name').textContent=p.name;$('ic').textContent=x.i;$('t').textContent=T(c.temperature_2m);$('desc').textContent=x.d+' · รู้สึกเหมือน '+T(c.apparent_temperature);
 $('hl').textContent='สูงสุด '+T(d.temperature_2m_max[0])+' ต่ำสุด '+T(d.temperature_2m_min[0]);
 var on=S.favs.some(function(f){return key(f)===key(p)});$('fav').textContent=on?'★':'☆';
 var det=[['ความชื้น',c.relative_humidity_2m+'%'],['ลม',Math.round(c.wind_speed_10m)+' กม./ชม. '+wdir(c.wind_direction_10m)],['ความกดอากาศ',Math.round(c.pressure_msl)+' hPa'],['เมฆปกคลุม',c.cloud_cover+'%'],['ฝนขณะนี้',c.precipitation+' มม.'],['ดัชนี UV วันนี้',Math.round(d.uv_index_max[0])+' ('+uv(d.uv_index_max[0])+')'],['พระอาทิตย์ขึ้น',hhmm(d.sunrise[0])],['พระอาทิตย์ตก',hhmm(d.sunset[0])]];
 $('det').innerHTML=det.map(function(i){return '<div class="m"><span>'+i[0]+'</span><b>'+esc(i[1])+'</b></div>'}).join('');
 var i0=0;for(var i=0;i<h.time.length;i++){if(h.time[i]>=c.time.slice(0,13)+':00'){i0=i;break}}
 var hs='';for(var k=i0;k<i0+24&&k<h.time.length;k++){var hx=wc(h.weather_code[k],h.is_day[k]);hs+='<div class="h"><div>'+(k===i0?'ตอนนี้':hhmm(h.time[k]))+'</div><div class="i">'+hx.i+'</div><b>'+T(h.temperature_2m[k])+'</b><div class="r">'+(h.precipitation_probability[k]>=10?'💧'+h.precipitation_probability[k]+'%':'')+'</div></div>'}
 $('hr').innerHTML=hs;
 var mn=Math.min.apply(null,d.temperature_2m_min),mx=Math.max.apply(null,d.temperature_2m_max),rg=mx-mn||1,ds='';
 for(var j=0;j<d.time.length;j++){var dt=new Date(d.time[j]+'T12:00'),dx=wc(d.weather_code[j],1),l=(d.temperature_2m_min[j]-mn)/rg*100,wd=(d.temperature_2m_max[j]-d.temperature_2m_min[j])/rg*100;
  ds+='<div class="d"><div>'+(j===0?'วันนี้':dt.toLocaleDateString('th-TH',{weekday:'short',day:'numeric'}))+'</div><div title="'+esc(dx.d)+'">'+dx.i+'</div><div><div class="bar2"><i style="left:'+l+'%;width:'+Math.max(wd,4)+'%"></i></div><small style="color:var(--mu)">'+esc(dx.d)+(d.precipitation_probability_max[j]>=10?' · 💧'+d.precipitation_probability_max[j]+'%':'')+'</small></div><div>'+T(d.temperature_2m_min[j])+' / <b>'+T(d.temperature_2m_max[j])+'</b></div></div>'}
 $('dy').innerHTML=ds;
 var ac=cur.a&&cur.a.current;
 if(ac){var q=aqi(ac.us_aqi);$('aq').innerHTML='<div class="m"><span>US AQI</span><b style="color:'+q[1]+'">'+Math.round(ac.us_aqi)+' · '+q[0]+'</b></div><div class="m"><span>PM2.5</span><b>'+Math.round(ac.pm2_5)+' µg/m³</b></div><div class="m"><span>PM10</span><b>'+Math.round(ac.pm10)+' µg/m³</b></div>'}
 else $('aq').innerHTML='<div class="m"><span>ไม่มีข้อมูลคุณภาพอากาศ</span><b>–</b></div>';
 $('upd').textContent='อัปเดตข้อมูลล่าสุด '+c.time.replace('T',' ')+' (เวลาท้องถิ่น)';
 favs()}
function favs(){$('favs').innerHTML=S.favs.map(function(f,i){return '<button class="chip" data-i="'+i+'">'+esc(f.name)+'</button>'}).join('')}
$('favs').onclick=function(e){var i=e.target.getAttribute('data-i');if(i!==null)go(S.favs[+i])};
$('fav').onclick=function(){if(!cur)return;var k=key(cur.p),i=-1;S.favs.forEach(function(f,n){if(key(f)===k)i=n});if(i>-1)S.favs.splice(i,1);else if(S.favs.length<8)S.favs.push(cur.p);save();render()};
$('uc').onclick=$('uf').onclick=function(e){S.unit=e.target.id==='uf'?'F':'C';$('uc').className=S.unit==='C'?'on':'';$('uf').className=S.unit==='F'?'on':'';save();if(cur)render()};
var tm;
$('q').oninput=function(){clearTimeout(tm);var v=this.value.trim();if(v.length<2){$('sug').hidden=true;return}
 tm=setTimeout(function(){getJ('https://geocoding-api.open-meteo.com/v1/search?count=6&language=th&name='+encodeURIComponent(v)).then(function(r){
  var rs=r.results||[];if(!rs.length){$('sug').innerHTML='<button disabled>ไม่พบเมืองที่ค้นหา</button>';$('sug').hidden=false;return}
  $('sug').innerHTML=rs.map(function(x,i){return '<button data-j="'+i+'">'+esc(x.name)+(x.admin1?', '+esc(x.admin1):'')+', '+esc(x.country||'')+'</button>'}).join('');$('sug').hidden=false;$('sug')._r=rs}).catch(function(){})},300)};
$('sug').onclick=function(e){var j=e.target.getAttribute('data-j');if(j===null)return;var x=$('sug')._r[+j];$('sug').hidden=true;$('q').value='';go({name:x.name+(x.admin1?', '+x.admin1:''),lat:x.latitude,lon:x.longitude})};
document.addEventListener('click',function(e){if(!$('sug').contains(e.target)&&e.target!==$('q'))$('sug').hidden=true});
$('gps').onclick=function(){
 if(!navigator.geolocation){msg('อุปกรณ์ไม่รองรับการระบุตำแหน่ง',1);return}
 msg('กำลังหาตำแหน่ง…');
 navigator.geolocation.getCurrentPosition(function(p){go({name:'ตำแหน่งของฉัน',lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4)})},function(){msg('ไม่สามารถระบุตำแหน่งได้ กรุณาอนุญาตการเข้าถึงตำแหน่ง หรือค้นหาชื่อเมือง',1);if(S.place)setTimeout(function(){go(S.place)},2500)},{timeout:10000})};
load();$('uc').className=S.unit==='C'?'on':'';$('uf').className=S.unit==='F'?'on':'';favs();
go(S.place||{name:'กรุงเทพมหานคร',lat:13.7563,lon:100.5018});
setInterval(function(){if(cur&&!document.hidden)go(cur.p)},600000);
})();
</script>
</body>
</html>
